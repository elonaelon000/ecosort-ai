name: Train EcoSort model

on:
  push:
    branches:
      - feature/live-demo
    paths:
      - .github/workflows/train-model.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install numpy scikit-learn matplotlib Pillow pytest

      - name: Download and verify TrashNet
        run: python scripts/download_trashnet.py

      - name: Prepare deterministic train/validation/test split
        run: python scripts/prepare_dataset.py

      - name: Train MobileNetV3 transfer-learning model
        run: python -m src.ecosort.train --architecture mobilenet --pretrained --epochs 8

      - name: Evaluate on held-out test set
        run: python -m src.ecosort.evaluate

      - name: Run tests
        run: python -m pytest -q

      - name: Commit trained model and evaluation reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/ecosort.pt \
            reports/training_history.json \
            reports/training_history.png \
            reports/metrics.json \
            reports/classification_report.txt \
            reports/confusion_matrix.png
          if git diff --cached --quiet; then
            echo "No generated artifacts to commit."
          else
            git commit -m "Add trained EcoSort model and evaluation results"
            git push origin HEAD:feature/live-demo
          fi
